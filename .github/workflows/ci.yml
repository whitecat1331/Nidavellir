name: Nidavellir CI

# CI tiers (2026-10-17). Jobs run in parallel, so wall time is the slowest
# job: build-smoke (17m) and the windows/macos test legs (12-16m) are the
# critical path, while the ubuntu test slice is ~7m and is what caught the
# 1.22 default.json regression. So:
#   - push to dev          -> LIGHT: checks + check + clippy + ubuntu tests
#   - `ci-full-*` tag      -> FULL: 3-OS test matrix + workspace compile smoke
#   - pull_request to main -> FULL (used if a dev -> main promotion PR returns)
#   - workflow_dispatch    -> FULL on demand, when this file is on the default
#                             branch. `main` is an upstream mirror without it,
#                             so the `ci-full-*` tag is the dependable trigger.
# Release gate: push `ci-full-<sha>` on the dev head before rebuilding the
# shared feature/dev slots and require it green.
on:
  push:
    branches: [dev]
    tags: ['ci-full-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Include the event so a push cannot cancel a release-gate run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  checks:
    name: Format, repo checks, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Keymaps
        run: script/check-keymaps
      - name: Links
        run: script/check-links local
      - name: TODOs
        run: script/check-todos
      - name: Licenses
        run: script/check-licenses

  clippy:
    name: Clippy (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev \
            libssl-dev libva-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-cursor-dev libgit2-dev libzstd-dev libsqlite3-dev
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2 wasm32-unknown-unknown x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Clippy
        run: ./script/clippy

  check:
    name: Check (fork crates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2 wasm32-unknown-unknown x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: cargo check
        run: cargo check -p project -p debugger_ui -p agent -p dap -p acp_thread -p agent_settings -p agent_ui -p dap_adapters

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # LIGHT tier (branch push): ubuntu only. FULL tier (tag, PR, dispatch):
        # the three-OS matrix.
        os: ${{ (github.event_name == 'push' && github.ref_type == 'branch') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev \
            libssl-dev libva-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-cursor-dev libgit2-dev libzstd-dev libsqlite3-dev
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2 wasm32-unknown-unknown x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Crate tests
        run: cargo test -p project -p debugger_ui -p agent -p dap -p acp_thread -p agent_settings -p agent_ui

  build-smoke:
    name: Workspace compile smoke
    # FULL tier only: this is the CI critical path (17m) and compiles targets
    # the light jobs already exercise.
    if: "!(github.event_name == 'push' && github.ref_type == 'branch')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev \
            libssl-dev libva-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-cursor-dev libgit2-dev libzstd-dev libsqlite3-dev
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-wasip2 wasm32-unknown-unknown x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: cargo test --no-run
        run: cargo test --workspace --no-run
